name: Build kernel RPM
description: >
  Install build dependencies and compile the QCOM kernel into
  binary RPMs via scripts/build_binrpm_pkg.py. The kernel is pinned to a
  static branch (default qcom-6.18.y); override kernel-ref/kernel-repo to
  build another branch or fork.

inputs:
  kernel-ref:
    description: Kernel branch/ref to build
    required: false
    default: qcom-6.18.y
  kernel-repo:
    description: Git repository URL to clone the kernel from
    required: false
    default: https://github.com/qualcomm-linux/kernel

runs:
  using: composite
  steps:
    - name: Install kernel build dependencies
      shell: bash
      run: |
        set -euo pipefail
        dnf install -y \
          git make gcc bc bison flex perl python3 \
          openssl openssl-devel elfutils-libelf-devel elfutils-devel \
          rpm-build rpmdevtools \
          rsync tar gzip findutils diffutils \
          kmod dwarves \
          hostname which

    - name: Sync kernel source
      shell: bash
      env:
        KERNEL_REPO: ${{ inputs.kernel-repo }}
        KERNEL_REF: ${{ inputs.kernel-ref }}
      run: |
        set -euo pipefail
        git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_REPO" "$GITHUB_WORKSPACE/linux"

    - name: Apply kernel patches
      shell: bash
      run: |
        set -euo pipefail

        patch_dir="$GITHUB_WORKSPACE/.github/patches"
        if [[ ! -d "$patch_dir" ]]; then
          echo "No kernel patch directory found: $patch_dir"
          exit 0
        fi

        shopt -s nullglob
        patches=("$patch_dir"/*.patch)
        if (( ${#patches[@]} == 0 )); then
          echo "No kernel patches found in $patch_dir"
          exit 0
        fi

        for patch in "${patches[@]}"; do
          echo "Applying kernel patch: $patch"
          git -C "$GITHUB_WORKSPACE/linux" apply --check "$patch"
          git -C "$GITHUB_WORKSPACE/linux" apply "$patch"
        done

    - name: Build kernel RPMs
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/build_binrpm_pkg.py \
          --local-dir "$GITHUB_WORKSPACE/linux"

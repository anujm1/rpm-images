name: Build on PR

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read
  packages: read

jobs:
  event-file:
    name: "Upload event file"
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Event File
        path: ${{ github.event_path }}

  build-pr:
    uses: ./.github/workflows/build-rpm.yml
